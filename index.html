        let selectedWeek = 2;
        let selectedDay = 0;

        const REF_MONDAY_WEEK2 = new Date(2026, 9, 19);
        REF_MONDAY_WEEK2.setHours(0, 0, 0, 0);

        function getMondayOfDate(date) {
            const temp = new Date(date);
            const day = temp.getDay();
            const diffToMonday = (day === 0 ? -6 : 1) - day;
            temp.setDate(temp.getDate() + diffToMonday);
            temp.setHours(0, 0, 0, 0);
            return temp;
        }

        function calculateWeekForDate(date) {
            const monday = getMondayOfDate(date);
            const diffWeeks = Math.floor((monday - REF_MONDAY_WEEK2) / (1000 * 60 * 60 * 24 * 7));
            return (Math.abs(diffWeeks) % 2 === 0) ? 2 : 1;
        }

        function calculateCurrentWeek() {
            return calculateWeekForDate(new Date());
        }

        // Индекс сегодняшнего дня (0..5 — пн..сб, 6 — воскресенье)
        function getTodayDayIndex() {
            const jsDay = new Date().getDay();
            return (jsDay === 0) ? 6 : jsDay - 1;
        }

        // Смотрим ли мы сейчас расписание на сегодняшний день
        function isViewingToday() {
            return selectedDay === getTodayDayIndex()
                && selectedWeek === calculateCurrentWeek();
        }

        function updateTodayButtonUI() {
            const btn = document.getElementById('btn-today');
            if (!btn) return;
            if (isViewingToday()) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        function updateWeekUI() {
            const btn1 = document.getElementById('btn-week-1');
            const btn2 = document.getElementById('btn-week-2');

            if (selectedWeek === 1) {
                btn1.classList.add('active');
                btn2.classList.remove('active');
            } else {
                btn2.classList.add('active');
                btn1.classList.remove('active');
            }

            document.getElementById('current-week-indicator').innerText = `${selectedWeek} неделя`;
        }

        function updateDayPillsUI() {
            for (let i = 0; i <= 5; i++) {
                const pill = document.getElementById(`day-pill-${i}`);
                if (!pill) continue;
                if (i === selectedDay) {
                    pill.classList.add('active');
                } else {
                    pill.classList.remove('active');
                }
            }
        }

        function renderLessons() {
            const container = document.getElementById('lessons-container');
            container.innerHTML = '';

            const dayData = SCHEDULE_DATA.find(d => d.dayIndex === selectedDay);
            const title = dayData ? dayData.dayName : (selectedDay === 6 ? "Воскресенье" : "Занятия");
            document.getElementById('active-day-title').innerText = title;

            if (!dayData || !dayData.lessons || dayData.lessons.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-8 text-center space-y-2">
                        <div class="inline-flex p-3 rounded-full bg-emerald-950/40 border border-emerald-800/30 text-emerald-400 mb-1">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        </div>
                        <h3 class="text-base font-medium text-white">Выходной день</h3>
                        <p class="text-xs text-brandTextMuted">На этот день пар не запланировано.</p>
                    </div>
                `;
                return;
            }

            const filteredLessons = dayData.lessons.filter(l => l.week.includes(selectedWeek));

            if (filteredLessons.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-8 text-center space-y-1">
                        <p class="text-sm font-medium text-white">Пар на ${selectedWeek}-ю неделю нет</p>
                        <p class="text-xs text-brandTextMuted">Отдыхайте или проверьте другую неделю.</p>
                    </div>
                `;
                return;
            }

            const timeMap = new Map();
            filteredLessons.forEach(lesson => {
                const key = `${lesson.timeStart}-${lesson.timeEnd}`;
                if (!timeMap.has(key)) {
                    timeMap.set(key, {
                        timeStart: lesson.timeStart,
                        timeEnd: lesson.timeEnd,
                        items: []
                    });
                }
                timeMap.get(key).items.push(lesson);
            });

            timeMap.forEach((groupObj) => {
                const card = document.createElement('div');
                card.className = "glass-card p-4 space-y-3";

                const hasSubgroups = groupObj.items.some(l => l.isSharedSlot && l.subgroups);
                const uniqueItems = [];

                if (hasSubgroups) {
                    groupObj.items.forEach(l => {
                        if (l.subgroups) {
                            uniqueItems.push(...l.subgroups);
                        }
                    });
                } else {
                    const seen = new Set();
                    groupObj.items.forEach(l => {
                        const identifier = `${l.title}|${l.type}|${l.teacher}|${l.room}`;
                        if (!seen.has(identifier)) {
                            seen.add(identifier);
                            uniqueItems.push(l);
                        }
                    });
                }

                if (hasSubgroups || (uniqueItems.length > 1 && uniqueItems.every(i => i.groupLabel))) {
                    let subgroupsHtml = uniqueItems.map(sub => `
                        <div class="glass-card-emerald p-3 space-y-1">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold text-emerald-300 uppercase tracking-wide">${sub.groupLabel || 'Подгруппа'}</span>
                                <span class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-emerald-900/60 text-emerald-200 border border-emerald-700/40">${sub.type}</span>
                            </div>
                            <h4 class="text-sm font-medium text-white leading-snug">${sub.title}</h4>
                            <div class="flex items-center justify-between text-xs text-brandTextMuted pt-1">
                                <span>${sub.teacher}</span>
                                <span class="text-emerald-400 font-medium">${sub.room}</span>
                            </div>
                        </div>
                    `).join('');

                    card.innerHTML = `

                            <div class="flex items-center gap-2">
                                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <span class="text-sm font-semibold text-white">${groupObj.timeStart} — ${groupObj.timeEnd}</span>
                            </div>
                        </div>
                        <div class="space-y-2">
                            ${subgroupsHtml}
                        </div>
                    `;
                } else {
                    const lesson = uniqueItems[0];
                    card.innerHTML = `
                        <div class="flex items-center justify-between border-b border-white/5 pb-2.5">
                            <div class="flex items-center gap-2">
                                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <span class="text-sm font-semibold text-white">${lesson.timeStart} — ${lesson.timeEnd}</span>
                            </div>

                        <div class="space-y-1">
                            <h3 class="text-base font-semibold text-white leading-snug">${lesson.title}</h3>
                            <div class="flex items-center justify-between text-xs text-brandTextMuted pt-1">
                                <span>${lesson.teacher && lesson.teacher !== '—' ? lesson.teacher : ''}</span>
                                <span class="text-emerald-400 font-medium flex items-center gap-1">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                                    ${lesson.room}
                                </span>
                            </div>
                        </div>
                    `;
                }

                container.appendChild(card);
            });
        }

        function selectWeek(weekNum) {
            selectedWeek = weekNum;
            updateWeekUI();
            updateTodayButtonUI();
            renderLessons();
        }

        function selectDay(dayIdx) {
            selectedDay = dayIdx;
            updateDayPillsUI();
            updateTodayButtonUI();
            renderLessons();
        }

        function jumpToToday() {
            selectedDay = getTodayDayIndex();
            selectedWeek = calculateCurrentWeek();

            updateWeekUI();
            updateDayPillsUI();
            updateTodayButtonUI();
            renderLessons();
        }

        function onDateSelected(event) {
            const value = event.target.value;
            if (!value) return;

            const parts = value.split('-');
            const year = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const day = parseInt(parts[2], 10);
            const date = new Date(year, month, day);

            const jsDay = date.getDay(); // 0 = воскресенье
            selectedDay = (jsDay === 0) ? 6 : jsDay - 1;
            selectedWeek = calculateWeekForDate(date);

            updateWeekUI();
            updateDayPillsUI();
            updateTodayButtonUI();
            renderLessons();
        }

        window.addEventListener('DOMContentLoaded', () => {
            jumpToToday();
        });
    </script>
</body>
</html>
