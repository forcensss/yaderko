<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>БНТУ 10608126 — Расписание</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Times New Roman"', 'Times', 'serif']
                    },
                    colors: {
                        brandBg: '#000000',
                        brandCard: 'rgba(15, 25, 20, 0.4)',
                        brandCardBorder: 'rgba(30, 75, 45, 0.4)',
                        brandGreen: '#059669',
                        brandGreenDark: '#047857',
                        brandGreenGlow: 'rgba(27, 94, 58, 0.4)',
                        brandTextPrimary: '#ffffff',
                        brandTextMuted: '#9ca3af'
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(15, 61, 36, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 70%, rgba(15, 61, 36, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* Glassmorphic card styling */
        .glass-card {
            background: rgba(12, 22, 17, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(30, 75, 45, 0.4);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .glass-card-emerald {
            background: rgba(15, 61, 36, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(46, 139, 87, 0.4);
            border-radius: 12px;
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(30, 75, 45, 0.4);
            color: #9ca3af;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button.active {
            background: #1b5e3a;
            border-color: #2e8b57;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(27, 94, 58, 0.4);
        }

        .pill-day {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(30, 75, 45, 0.3);
            color: #9ca3af;
            transition: all 0.2s ease;
        }

        .pill-day.active {
            background: rgba(27, 94, 58, 0.4);
            border-color: #2e8b57;
            color: #ffffff;
            font-weight: bold;
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen p-4 pb-12 antialiased">

    <div class="max-w-md mx-auto space-y-4">

        <!-- Header -->
        <header class="glass-card p-4 flex items-center justify-between">
            <div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-xs uppercase tracking-widest text-brandTextMuted font-medium">БНТУ • ЭФ</span>
                </div>
                <h1 class="text-xl font-bold text-white tracking-tight mt-0.5">Группа 10608126</h1>
            </div>
            
            <div id="current-week-indicator" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-950/80 border border-emerald-500/30 text-emerald-300">
                2 неделя
            </div>
        </header>

        <!-- Week Switcher -->
        <div class="glass-card p-1.5 grid grid-cols-2 gap-1.5">
            <button id="btn-week-1" onclick="selectWeek(1)" class="glass-button py-2.5 px-4 rounded-xl text-sm font-medium text-center">
                1 неделя
            </button>
            <button id="btn-week-2" onclick="selectWeek(2)" class="glass-button py-2.5 px-4 rounded-xl text-sm font-medium text-center">
                2 неделя
            </button>
        </div>

        <!-- Days Navigation Bar -->
        <div class="grid grid-cols-6 gap-1.5">
            <button onclick="selectDay(0)" id="day-pill-0" class="pill-day py-3 rounded-xl text-xs text-center transition-all">
                Пн
            </button>
            <button onclick="selectDay(1)" id="day-pill-1" class="pill-day py-3 rounded-xl text-xs text-center transition-all">
                Вт
            </button>
            <button onclick="selectDay(2)" id="day-pill-2" class="pill-day py-3 rounded-xl text-xs text-center transition-all">
                Ср
            </button>
            <button onclick="selectDay(3)" id="day-pill-3" class="pill-day py-3 rounded-xl text-xs text-center transition-all">
                Чт
            </button>
            <button onclick="selectDay(4)" id="day-pill-4" class="pill-day py-3 rounded-xl text-xs text-center transition-all">
                Пт
            </button>
            <button onclick="selectDay(5)" id="day-pill-5" class="pill-day py-3 rounded-xl text-xs text-center transition-all">
                Сб
            </button>
        </div>

        <!-- Day Label & Today Jump -->
        <div class="flex items-center justify-between px-1">
            <h2 id="active-day-title" class="text-lg font-bold text-white tracking-tight">
                Понедельник
            </h2>
            <button onclick="jumpToToday()" class="text-xs font-medium text-emerald-400 hover:text-emerald-300 transition-colors flex items-center gap-1 bg-emerald-950/40 px-2.5 py-1 rounded-lg border border-emerald-800/40">
                Сегодня
            </button>
        </div>

        <!-- Lessons Container -->
        <div id="lessons-container" class="space-y-3">
            <!-- Populated via JS -->
        </div>

    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            window.Telegram.WebApp.setBackgroundColor('#000000');
            window.Telegram.WebApp.setHeaderColor('#000000');
        }

        // Updated Schedule Data based on exact screenshots provided
        const SCHEDULE_DATA = [
            // 0: Понедельник
            {
                dayIndex: 0,
                dayName: "Понедельник",
                lessons: [
                    { timeStart: "09:55", timeEnd: "11:30", week: [1, 2], type: "ЛЕКЦ", title: "Математика", teacher: "проф. Роговцов Н.Н.", room: "Корпус 1, ауд. 437" },
                    { timeStart: "11:40", timeEnd: "13:15", week: [2], type: "ПРАКТ", title: "Химия", teacher: "пр. Тишковская Е.А., пр. Кречко", room: "Корпус 11, ауд. 510; Корпус 11, ауд. 512" },
                    { timeStart: "11:40", timeEnd: "13:15", week: [1], type: "ПРАКТ", title: "Математика", teacher: "проф. Роговцов Н.Н.", room: "Корпус 1, ауд. 436" },
                    { timeStart: "13:55", timeEnd: "15:30", week: [2], type: "ОИЗ", title: "Математика", teacher: "проф. Роговцов Н.Н.", room: "Корпус 1, ауд. 438" },
                    { timeStart: "13:55", timeEnd: "15:30", week: [1], type: "ОИЗ", title: "Инженерная графика", teacher: "доц. Ким Ю.А.", room: "Корпус 8, ауд. 519" },
                    { timeStart: "15:40", timeEnd: "17:15", week: [2], type: "ЗАНЯТИЕ", title: "Кураторский / информационный час", teacher: "ст.пр. Пронкевич Е.В.", room: "Корпус 21, ауд. 1012" }
                ]
            },
            // 1: Вторник
            {
                dayIndex: 1,
                dayName: "Вторник",
                lessons: [
                    { timeStart: "11:40", timeEnd: "13:15", week: [1, 2], type: "ПРАКТ", title: "Инженерная графика", teacher: "—", room: "Корпус 8, ауд. 518" },
                    { timeStart: "13:55", timeEnd: "15:30", week: [1], type: "ЛЕКЦ", title: "Введение в инженерное образование", teacher: "проф. Карницкий Н.Б.", room: "Корпус 21, ауд. 1110" }
                ]
            },
            // 2: Среда
            {
                dayIndex: 2,
                dayName: "Среда",
                lessons: [
                    { timeStart: "08:00", timeEnd: "09:35", week: [1], type: "ПРАКТ", title: "Инженерная графика", teacher: "—", room: "Корпус 8, ауд. 520" },
                    { timeStart: "08:00", timeEnd: "09:35", week: [2], type: "ПРАКТ", title: "История белорусской государственности", teacher: "доц. Альховик Н.К.", room: "Корпус 1, ауд. 417" },
                    { timeStart: "09:55", timeEnd: "11:30", week: [1, 2], type: "ЛЕКЦ", title: "Информатика и интегрированные прикладные системы", teacher: "ст.пр. Пронкевич Е.В.", room: "Корпус 21, ауд. 1110" }
                ]
            },
            // 3: Четверг (согласно вашим скриншотам)
            {
                dayIndex: 3,
                dayName: "Четверг",
                lessons: [
                    { timeStart: "09:55", timeEnd: "11:30", week: [1, 2], type: "ПРАКТ", title: "Математика", teacher: "проф. Роговцов Н.Н.", room: "Корпус 8, ауд. 422" },
                    { timeStart: "11:40", timeEnd: "13:15", week: [1, 2], type: "ЛЕКЦ", title: "История белорусской государственности", teacher: "доц. Альховик Н.К.", room: "Корпус 8, ауд. 310" },
                    {
                        timeStart: "13:55", timeEnd: "15:30", week: [1, 2],
                        isSplit: true,
                        subgroups: [
                            { groupLabel: "Подгруппа 1", type: "ЛАБ", title: "Материаловедение", teacher: "ст.пр. Миньков А.Л.", room: "Корпус 7, ауд. 11" },
                            { groupLabel: "Подгруппа 2", type: "ЛАБ", title: "Информатика и интегрированные прикладные системы", teacher: "ст.пр. Пронкевич Е.В.", room: "Корпус 21, ауд. 714" }
                        ]
                    },
                    { timeStart: "15:40", timeEnd: "17:15", week: [1, 2], type: "ЗАНЯТИЕ", title: "Информатика и интегрированные прикладные системы", teacher: "ст.пр. Пронкевич Е.В.", room: "Корпус 21, ауд. 714" }
                ]
            },
            // 4: Пятница
            {
                dayIndex: 4,
                dayName: "Пятница",
                lessons: [
                    { timeStart: "08:00", timeEnd: "09:35", week: [1, 2], type: "ПРАКТ", title: "Английский язык", teacher: "пр. Коршун А.А.", room: "Корпус 18, ауд. 430" }
                ]
            },
            // 5: Суббота
            {
                dayIndex: 5,
                dayName: "Суббота",
                lessons: [
                    { timeStart: "08:00", timeEnd: "09:35", week: [1, 2], type: "ЛЕКЦ", title: "Материаловедение", teacher: "ст.пр. Миньков А.П.", room: "Корпус 8, ауд. 310" },
                    { timeStart: "09:55", timeEnd: "11:30", week: [1, 2], type: "ЛЕКЦ", title: "Инженерная графика", teacher: "доц. Ким Ю.А.", room: "Корпус 8, ауд. 310" }
                ]
            }
        ];

        let selectedWeek = 2;
        let selectedDay = 0;

        const REF_MONDAY_WEEK2 = new Date(2026, 9, 19);

        function calculateCurrentWeek() {
            const today = new Date();
            const tempDate = new Date(today);
            const day = tempDate.getDay();
            const diffToMonday = (day === 0 ? -6 : 1) - day;
            tempDate.setDate(tempDate.getDate() + diffToMonday);
            tempDate.setHours(0,0,0,0);

            const refDate = new Date(REF_MONDAY_WEEK2);
            refDate.setHours(0,0,0,0);

            const diffWeeks = Math.floor((tempDate - refDate) / (1000 * 60 * 60 * 24 * 7));
            return (Math.abs(diffWeeks) % 2 === 0) ? 2 : 1;
        }

        function updateWeekUI() {
            const btn1 = document.getElementById('btn-week-1');
            const btn2 = document.getElementById('btn-week-2');

            if (selectedWeek === 1) {
                btn1.classList.add('active');
                btn2.classList.remove('active');
            } else {
                btn2.classList.add('active');
                btn1.classList.remove('active');
            }

            document.getElementById('current-week-indicator').innerText = `${selectedWeek} неделя`;
        }

        function updateDayPillsUI() {
            for (let i = 0; i <= 5; i++) {
                const pill = document.getElementById(`day-pill-${i}`);
                if (!pill) continue;
                if (i === selectedDay) {
                    pill.classList.add('active');
                } else {
                    pill.classList.remove('active');
                }
            }
        }

        function renderLessons() {
            const container = document.getElementById('lessons-container');
            container.innerHTML = '';

            const dayData = SCHEDULE_DATA.find(d => d.dayIndex === selectedDay);
            document.getElementById('active-day-title').innerText = dayData ? dayData.dayName : "Занятия";

            if (!dayData || !dayData.lessons || dayData.lessons.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-8 text-center space-y-2">
                        <h3 class="text-base font-medium text-white">Выходной день</h3>
                        <p class="text-xs text-brandTextMuted">На этот день пар не запланировано.</p>
                    </div>
                `;
                return;
            }

            const filteredLessons = dayData.lessons.filter(l => l.week.includes(selectedWeek));

            if (filteredLessons.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-8 text-center space-y-1">
                        <p class="text-sm font-medium text-white">Пар на ${selectedWeek}-ю неделю нет</p>
                        <p class="text-xs text-brandTextMuted">Отдыхайте или проверьте другую неделю.</p>
                    </div>
                `;
                return;
            }

            filteredLessons.forEach(lesson => {
                const card = document.createElement('div');
                card.className = "glass-card p-4 space-y-3";

                if (lesson.isSplit) {
                    let subgroupsHtml = lesson.subgroups.map(sub => `
                        <div class="glass-card-emerald p-3 space-y-1">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold text-emerald-300 uppercase tracking-wide">${sub.groupLabel}</span>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-900/60 text-emerald-200 border border-emerald-700/40">${sub.type}</span>
                            </div>
                            <h4 class="text-sm font-bold text-white leading-snug">${sub.title}</h4>
                            <div class="flex items-center justify-between text-xs text-brandTextMuted pt-1">
                                <span>${sub.teacher}</span>
                                <span class="text-emerald-400 font-bold">${sub.room}</span>
                            </div>
                        </div>
                    `).join('');

                    card.innerHTML = `
                        <div class="flex items-center justify-between border-b border-white/5 pb-2">
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-bold text-emerald-400">${lesson.timeStart} — ${lesson.timeEnd}</span>
                            </div>
                        </div>
                        <div class="space-y-2">
                            ${subgroupsHtml}
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="flex items-center justify-between border-b border-white/5 pb-2.5">
                            <span class="text-sm font-bold text-emerald-400">${lesson.timeStart} — ${lesson.timeEnd}</span>
                            ${lesson.type ? `<span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-white/5 text-brandTextMuted border border-white/10">${lesson.type}</span>` : ''}
                        </div>
                        <div class="space-y-1">
                            <h3 class="text-base font-bold text-white leading-snug">${lesson.title}</h3>
                            <div class="flex items-center justify-between text-xs text-brandTextMuted pt-1">
                                <span>${lesson.teacher && lesson.teacher !== '—' ? lesson.teacher : ''}</span>
                                <span class="text-emerald-400 font-bold">${lesson.room}</span>
                            </div>
                        </div>
                    `;
                }

                container.appendChild(card);
            });
        }

        function selectWeek(weekNum) {
            selectedWeek = weekNum;
            updateWeekUI();
            renderLessons();
        }

        function selectDay(dayIdx) {
            selectedDay = dayIdx;
            updateDayPillsUI();
            renderLessons();
        }

        function jumpToToday() {
            const today = new Date();
            let jsDay = today.getDay();
            selectedDay = (jsDay === 0) ? 5 : jsDay - 1;
            if (selectedDay > 5) selectedDay = 5;

            selectedWeek = calculateCurrentWeek();

            updateWeekUI();
            updateDayPillsUI();
            renderLessons();
        }

        window.addEventListener('DOMContentLoaded', () => {
            jumpToToday();
        });
    </script>
</body>
</html>
